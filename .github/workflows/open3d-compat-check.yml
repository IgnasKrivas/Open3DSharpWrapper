name: Open3D compatibility check

# Builds and tests against whatever Open3D release is CURRENTLY latest on
# GitHub, independent of the version pinned in Open3DSdk.props, so a new
# Open3D release that breaks this wrapper is caught proactively instead of
# silently (which is exactly how this repo broke against 0.15.1 -> later
# versions in the first place).
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  check-latest-open3d:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Resolve latest Open3D release
        id: latest
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/isl-org/Open3D/releases/latest"
          $version = $release.tag_name.TrimStart('v')
          Write-Host "Latest Open3D release: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Find MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find MSBuild\**\Bin\MSBuild.exe
          if (-not $msbuild) { throw "MSBuild with the VC++ workload was not found on this runner." }
          echo "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build against latest Open3D
        id: build
        shell: pwsh
        continue-on-error: true
        # See the note in ci.yml: block-scalar (|) form avoids a leading &
        # being parsed as a YAML anchor indicator.
        run: |
          & "${{ steps.msbuild.outputs.path }}" Open3DSharpWrapper.sln -p:Configuration=Debug -p:Platform=x64 -p:Open3DVersion=${{ steps.latest.outputs.version }} -restore -nologo -v:minimal

      - name: Run tests against latest Open3D
        id: test
        if: steps.build.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: dotnet test Open3DWrapper.Tests/Open3DWrapper.Tests.csproj -c Debug --no-build

      # Preview NuGet publish - only reachable once build+test above have
      # actually passed against this Open3D version. Prerelease-only (see
      # the -preview suffix below) so `dotnet add package` never resolves
      # this automatically; only explicit --prerelease/exact-version
      # consumers see it. Stable publishing stays fully manual (see
      # publish-nuget-stable.yml, triggered by cutting a GitHub Release).
      - name: Resolve preview package version
        id: preview_version
        if: steps.test.outcome == 'success'
        shell: pwsh
        run: |
          # Read PackageVersion straight from the csproj via regex rather than
          # `dotnet msbuild -getProperty` - that flag needs MSBuild 17.8+, and
          # this workflow deliberately pins the older .NET 6 SDK (matching the
          # project's TargetFramework), whose bundled MSBuild predates it.
          $csproj = Get-Content Open3DWrapper/Open3DWrapper.csproj -Raw
          if ($csproj -notmatch '<PackageVersion>([^<]+)</PackageVersion>') {
            throw "Could not find <PackageVersion> in Open3DWrapper/Open3DWrapper.csproj"
          }
          $previewVersion = "$($Matches[1])-preview.${{ steps.latest.outputs.version }}"
          Write-Host "Preview package version: $previewVersion"
          echo "version=$previewVersion" >> $env:GITHUB_OUTPUT

      - name: Check whether this preview was already published
        id: check_published
        if: steps.test.outcome == 'success'
        shell: pwsh
        run: |
          $packageId = "open3dsharpwrapper"
          $alreadyPublished = $false
          try {
            $existing = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$packageId/index.json" -ErrorAction Stop
            if ($existing.versions -contains "${{ steps.preview_version.outputs.version }}") {
              $alreadyPublished = $true
            }
          } catch {
            # Package not published yet at all, or a transient lookup error -
            # fail open to "not yet published" rather than silently skipping
            # what might be the very first preview.
            Write-Host "Could not check existing versions (may just mean the package doesn't exist yet): $_"
          }
          Write-Host "Already published: $alreadyPublished"
          echo "already_published=$alreadyPublished" >> $env:GITHUB_OUTPUT

      - name: Build solution (Release) against latest Open3D
        id: release_build
        if: steps.test.outcome == 'success' && steps.check_published.outputs.already_published == 'False'
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" Open3DSharpWrapper.sln -p:Configuration=Release -p:Platform=x64 -p:Open3DVersion=${{ steps.latest.outputs.version }} -restore -nologo -v:minimal

      - name: Pack preview package
        if: steps.release_build.outcome == 'success'
        shell: pwsh
        run: dotnet pack Open3DWrapper/Open3DWrapper.csproj -c Release -p:PackageVersion=${{ steps.preview_version.outputs.version }} -o nupkgs --no-build

      - name: Push preview package to NuGet
        if: steps.release_build.outcome == 'success'
        shell: pwsh
        run: |
          if ("${{ secrets.NUGET_API_KEY }}" -eq "") {
            Write-Host "::warning::NUGET_API_KEY is not set - skipping preview publish. Set it up in repo Settings > Secrets and variables > Actions to enable this."
            exit 0
          }
          dotnet nuget push nupkgs\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Open or update tracking issue on failure
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.latest.outputs.version }}";
            const title = `Open3D ${version} breaks the wrapper`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Automated compat-check found that building/testing against Open3D ${version} fails.\n\nFailed run: ${runUrl}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "open3d-compat",
            });
            const already = existing.data.find((i) => i.title === title);

            if (already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: already.number,
                body: `Still failing as of this run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["open3d-compat"],
              });
            }
